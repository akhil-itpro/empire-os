name: Documentation improvement
description: Report a missing, unclear or outdated instruction.
title: "Docs: "
body:
  - type: input
    id: document
    attributes:
      label: Document and section
      placeholder: docs/SETUP.md — local demo
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
      description: Explain what you tried and the correction you suggest. Never paste environment files, secret values or personal data.
    validations:
      required: true
