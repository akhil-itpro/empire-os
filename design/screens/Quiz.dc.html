<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiz, main goal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C1310}
a{color:#C9A24B}a:hover{color:#E8C873}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C1310; color: #ECE5D3; font-family: 'Schibsted Grotesk', system-ui, sans-serif; padding: 8px 20px 20px 20px; display: flex; flex-direction: column">

<div style="display: flex; align-items: center; gap: 12px; height: 52px">
<a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #ECE5D3; text-decoration: none; border-radius: 22px">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<div style="flex: 1; display: flex; gap: 4px" aria-hidden="true">
<div style="flex: 1; height: 4px; border-radius: 2px; background: #C9A24B"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #C9A24B"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #C9A24B"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #C9A24B"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #2A3A31"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #2A3A31"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #2A3A31"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #2A3A31"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #2A3A31"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #2A3A31"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #2A3A31"></div>
</div>
<span style="font-size: 14px; font-weight: 500; color: #9AA597; white-space: nowrap">4 of 11</span>
</div>

<h1 style="margin: 28px 0 0 0; font-family: 'Big Shoulders Display', 'Big Shoulders', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; color: #ECE5D3">What do you want most from the next 90 days?</h1>
<p style="margin: 12px 0 0 0; font-size: 15px; line-height: 1.5; color: #9AA597">Pick one. Your season is built around it, and you can change it later.</p>

<div style="margin-top: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{options}}" as="opt" hint-placeholder-count="6">
<sc-if value="{{opt.selected}}" hint-placeholder-val="{{false}}">
<button type="button" aria-pressed="true" onClick="{{opt.pick}}" style="position: relative; min-height: 124px; box-sizing: border-box; padding: 14px; border-radius: 14px; border: 2px solid #C9A24B; background: #1B2721; color: #ECE5D3; text-align: left; font-family: inherit; display: flex; flex-direction: column; gap: 6px; cursor: pointer">
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#C9A24B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{opt.icon}}"></path></svg>
<span style="margin-top: 6px; font-size: 16px; font-weight: 700; line-height: 1.25">{{opt.title}}</span>
<span style="font-size: 13px; line-height: 1.35; color: #B9C2B6">{{opt.desc}}</span>
<span style="position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 11px; background: #C9A24B; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#0C1310" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
</span>
</button>
</sc-if>
<sc-if value="{{opt.unselected}}" hint-placeholder-val="{{true}}">
<button type="button" aria-pressed="false" onClick="{{opt.pick}}" style="position: relative; min-height: 124px; box-sizing: border-box; padding: 14px; border-radius: 14px; border: 1.5px solid #2A3A31; background: #141E19; color: #ECE5D3; text-align: left; font-family: inherit; display: flex; flex-direction: column; gap: 6px; cursor: pointer">
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#9AA597" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{opt.icon}}"></path></svg>
<span style="margin-top: 6px; font-size: 16px; font-weight: 700; line-height: 1.25">{{opt.title}}</span>
<span style="font-size: 13px; line-height: 1.35; color: #9AA597">{{opt.desc}}</span>
</button>
</sc-if>
</sc-for>
</div>

<div style="flex: 1"></div>

<a href="Reveal.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; background: #C9A24B; color: #0C1310; font-weight: 700; font-size: 17px; text-decoration: none">Continue</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'job' };
  }
  renderVals() {
    var self = this;
    var list = [
      { id: 'job', title: 'Get my first job', desc: 'Placements, interviews, projects', icon: 'M4 8h16v11H4zM9 8V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v2M4 13h16' },
      { id: 'earn', title: 'Earn more or switch', desc: 'New skills, a stronger profile', icon: 'M3 17l6-6 4 4 8-8M15 7h6v6' },
      { id: 'side', title: 'Build a side income', desc: 'Freelance or a small business', icon: 'M4 10l1.5-5h13L20 10M4 10h16v10H4zM9 20v-5h6v5' },
      { id: 'fit', title: 'Get fit and strong', desc: 'Home or gym training', icon: 'M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12' },
      { id: 'discipline', title: 'Fix my discipline', desc: 'Phone, sleep and routine', icon: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z' },
      { id: 'money', title: 'Control my money', desc: 'Budget, save, stop the leaks', icon: 'M3 7h18v13H3zM3 11h18M16 16h2' }
    ];
    var options = list.map(function (o) {
      var on = self.state.picked === o.id;
      return {
        id: o.id, title: o.title, desc: o.desc, icon: o.icon,
        selected: on, unselected: !on,
        pick: function () { self.setState({ picked: o.id }); }
      };
    });
    return { options: options };
  }
}
</script>
</body>
</html>
