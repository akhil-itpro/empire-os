<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Archetype share card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800;900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C1310}
</style>
</helmet>
<div style="width: 360px; height: 640px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C1310; color: #ECE5D3; font-family: 'Schibsted Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 84px 28px 84px 28px">

<div style="display: flex; align-items: baseline; gap: 5px">
<span style="font-family: 'Big Shoulders Stencil Display', 'Big Shoulders Stencil', 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 20px; letter-spacing: 0.05em; color: #C9A24B">EMPIRE</span>
<span style="font-family: 'Big Shoulders Display', 'Big Shoulders', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.05em; color: #ECE5D3">OS</span>
</div>

<svg viewBox="0 0 360 360" width="150" height="150" role="img" aria-label="Season medallion, day 30 of 90" style="margin-top: 20px">
<circle cx="180" cy="180" r="178" fill="#101915" stroke="#2A3A31" stroke-width="2"></circle>
<path d="{{dimTicks}}" stroke="#2A3A31" stroke-width="5" stroke-linecap="round" fill="none"></path>
<path d="{{litTicks}}" stroke="#C9A24B" stroke-width="5" stroke-linecap="round" fill="none"></path>
<circle cx="180" cy="180" r="144" fill="#141E19" stroke="#8C6A2A" stroke-width="2.5"></circle>
<path d="M120 160l60-42 60 42M120 200l60-42 60 42M120 240l60-42 60 42" fill="none" stroke="#C9A24B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>

<h1 style="margin: 22px 0 0 0; text-align: center; font-family: 'Big Shoulders Display', 'Big Shoulders', sans-serif; font-weight: 800; font-size: 58px; line-height: 0.92; color: #ECE5D3">I'm The Grinder.</h1>
<p style="margin: 12px 0 0 0; text-align: center; font-size: 16px; line-height: 1.45; color: #ECE5D3">Season 1, day 30. Thirty days, no misses.</p>

<div style="margin-top: 18px; display: flex; gap: 8px">
<span style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #2A3A31; background: #141E19; display: flex; align-items: center; font-size: 13px; font-weight: 600">Operator</span>
<span style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #2A3A31; background: #141E19; display: flex; align-items: center; font-size: 13px; font-weight: 600">1,840 XP</span>
<span style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #2A3A31; background: #141E19; display: flex; align-items: center; font-size: 13px; font-weight: 600">30-day streak</span>
</div>

<div style="flex: 1"></div>

<p style="margin: 0; text-align: center; font-size: 15px; font-weight: 600; color: #C9A24B">What's your archetype? Link in bio.</p>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":640}}'>
class Component extends DCLogic {
  ticks(cx, cy, r1, r2, count, lit) {
    var litD = '';
    var dimD = '';
    for (var i = 0; i < count; i++) {
      var a = (i / count) * Math.PI * 2 - Math.PI / 2;
      var seg = 'M' + (cx + r1 * Math.cos(a)).toFixed(1) + ' ' + (cy + r1 * Math.sin(a)).toFixed(1) +
        'L' + (cx + r2 * Math.cos(a)).toFixed(1) + ' ' + (cy + r2 * Math.sin(a)).toFixed(1);
      if (i < lit) { litD += seg; } else { dimD += seg; }
    }
    return { litD: litD, dimD: dimD };
  }
  renderVals() {
    var t = this.ticks(180, 180, 156, 172, 90, 30);
    return { litTicks: t.litD, dimTicks: t.dimD };
  }
}
</script>
</body>
</html>
